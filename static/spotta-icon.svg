<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122438"/>
      <stop offset="1" stop-color="#0C1826"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4B740"/>
      <stop offset="1" stop-color="#E9A317"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle radar rings behind the pin (the 'AI finds it' motif) -->
  <circle cx="256" cy="212" r="150" fill="none" stroke="#00C2A8" stroke-width="3" opacity="0.14"/>
  <circle cx="256" cy="212" r="112" fill="none" stroke="#00C2A8" stroke-width="3" opacity="0.22"/>

  <!-- location pin -->
  <path d="M256 96
           C186 96 132 150 132 220
           C132 300 224 388 250 412
           a8 8 0 0 0 12 0
           C288 388 380 300 380 220
           C380 150 326 96 256 96 Z"
        fill="url(#pin)" filter="url(#soft)"/>

  <!-- inner navy circle to hold the P -->
  <circle cx="256" cy="216" r="74" fill="#0C1826"/>

  <!-- letter P -->
  <path d="M228 176
           h34
           a34 34 0 0 1 0 68
           h-16
           v28
           h-18 Z
           M246 194 v32 h16 a16 16 0 0 0 0 -32 Z"
        fill="#F4B740"/>

  <!-- small teal 'live' dot, echoing the app's live indicator -->
  <circle cx="316" cy="164" r="15" fill="#00C2A8"/>
</svg>
