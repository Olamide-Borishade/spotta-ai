{% extends "base.html" %}

{% block title %}Sign up — Spotta AI{% endblock %}

{% block content %}
  <h2>Create your account</h2>
  <p class="results-heading">Sign up to track your parking activity.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form class="auth-form" method="POST" action="/signup">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign up</button>
  </form>

  <p class="results-heading">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
